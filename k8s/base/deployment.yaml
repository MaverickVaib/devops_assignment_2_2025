apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace-api
  labels: { app: ace-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: ace-api }
  template:
    metadata: { labels: { app: ace-api } }
    spec:
      containers:
        - name: web
          image: docker.io/maverickvaib/aceest-fitness:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
