apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace-api-green
  labels: { app: ace-api, track: green }
spec:
  replicas: 2
  selector: { matchLabels: { app: ace-api, track: green } }
  template:
    metadata: { labels: { app: ace-api, track: green } }
    spec:
      containers:
        - name: web
          image: docker.io/maverickvaib/aceest-fitness:latest
          ports: [{ containerPort: 5000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 5, periodSeconds: 10 }
